name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
        env:
          # Nonfunctional placeholders validate compilation without a Clerk account.
          # They cannot authenticate users and must never be used for deployment.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5pbnZhbGlkJA==
          CLERK_SECRET_KEY: sk_test_ciPlaceholder
          # Unreachable placeholder proves compilation requires no live database.
          DATABASE_URL: postgresql://ci:placeholder@127.0.0.1:1/afcs_ci

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: afcs_task07_verify
          POSTGRES_USER: afcs_ci
          POSTGRES_PASSWORD: ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afcs_ci -d afcs_task07_verify"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Fixed credentials are only for this job's disposable service.
      DATABASE_URL: postgresql://afcs_ci:ci_only@127.0.0.1:5432/afcs_task07_verify
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply committed migrations and verify repeat application
        run: |
          npm run db:migrate
          npm run db:migrate
      - name: Run PostgreSQL integration tests
        run: npm run test -- src/db/onboarding.integration.test.ts src/db/staff.integration.test.ts src/db/catalog.integration.test.ts src/db/products.integration.test.ts
        env:
          AFCS_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
